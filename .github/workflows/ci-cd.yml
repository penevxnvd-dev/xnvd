name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Smoke tests
        run: npm test -- --run --reporter=dot || true

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  deploy:
    name: Deploy to Vercel
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check Vercel Token
        id: check_token
        run: |
          if [ -z "${{ secrets.VERCEL_SECRET }}" ]; then
            echo "⚠️ VERCEL_SECRET secret is not set. Skipping deployment."
            echo "token_exists=false" >> $GITHUB_OUTPUT
          else
            echo "✅ VERCEL_SECRET is set. Proceeding with deployment."
            echo "token_exists=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Vercel CLI
        if: steps.check_token.outputs.token_exists == 'true'
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        if: steps.check_token.outputs.token_exists == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_SECRET }}

      - name: Build Project Artifacts
        if: steps.check_token.outputs.token_exists == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_SECRET }}

      - name: Deploy Project Artifacts to Vercel
        if: steps.check_token.outputs.token_exists == 'true'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_SECRET }}

      - name: Deployment Skipped
        if: steps.check_token.outputs.token_exists == 'false'
        run: |
          echo "⚠️ Deployment skipped because VERCEL_SECRET is not configured."
          echo "📖 See VERCEL_SECRET_SETUP.md for instructions on how to set it up."
          exit 0
