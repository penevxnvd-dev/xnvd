name: Auto Sync Supabase Data

on:
  # Schedule disabled to avoid noisy commits every 30 minutes.
  # Re-enable the cron block if automatic sync is required again.
  # schedule:
  #   - cron: '*/30 * * * *'
  workflow_dispatch: # Manual trigger only

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Sync Supabase and generate hardcoded data
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node scripts/sync-and-hardcode.js

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/lib/hardcodedData.ts public/local-backup/ hardcoded-data.json
          git diff --staged --quiet || git commit -m "chore: manual sync of hardcoded data from Supabase"
          git push
