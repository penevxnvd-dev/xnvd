  <body>
    <div id="root"></div>
    <!-- Early console filter to catch SES errors from browser extensions -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        
        const originalError = console.error;
        const originalWarn = console.warn;
        
        // Aggressive SES error filtering - must be set up before any modules load
        // These errors come from browser extensions (MetaMask, etc.) and don't affect the app
        const filterSES = function(...args) {
          const message = String(args[0] || '');
          const allArgsStr = args.map(arg => {
            if (arg instanceof Error) {
              return (arg.message || '') + ' ' + (arg.stack || '');
            }
            return String(arg);
          }).join(' ').toLowerCase();
          
          const messageLower = message.toLowerCase();
          
          // Comprehensive SES filtering - check for any SES-related content
          return messageLower.includes('ses_uncaught_exception') ||
                 messageLower.includes('ses removing') ||
                 messageLower.includes('ses ') ||
                 messageLower.includes('lockdown-install') ||
                 allArgsStr.includes('ses_uncaught_exception') ||
                 allArgsStr.includes('ses removing') ||
                 allArgsStr.includes('lockdown-install') ||
                 allArgsStr.includes('removing unpermitted intrinsics') ||
                 allArgsStr.includes('removing intrinsics') ||
                 allArgsStr.includes('removing intrinsics.%') ||
                 allArgsStr.includes('totemporalinstant') ||
                 allArgsStr.includes('getorinsert') ||
                 allArgsStr.includes('getorinsertcomputed') ||
                 allArgsStr.includes('mapprototype') ||
                 allArgsStr.includes('weakmapprototype') ||
                 allArgsStr.includes('dateprototype') ||
                 allArgsStr.includes('intrinsics.%');
        };
        
        // Filter WebSocket/Realtime errors (non-critical)
        // Also filter old project WebSocket attempts
        const filterWebSocket = function(...args) {
          const message = String(args[0] || '');
          const allArgsStr = args.map(arg => String(arg)).join(' ').toLowerCase();
          
          return message.toLowerCase().includes('websocket') ||
                 message.toLowerCase().includes('realtime') ||
                 message.toLowerCase().includes('ufpeftuanzmkiryohesd') ||
                 allArgsStr.includes('websocket') ||
                 allArgsStr.includes('realtime/v1/websocket') ||
                 allArgsStr.includes('ns_error_websocket') ||
                 allArgsStr.includes('connection_refused') ||
                 allArgsStr.includes('ufpeftuanzmkiryohesd');
        };
        
        // Filter cookie domain warnings (browser security, not app errors)
        const filterCookieWarnings = function(...args) {
          const message = String(args[0] || '');
          return message.includes('Cookie') && 
                 message.includes('rejected') && 
                 message.includes('domain');
        };
        
        console.error = function(...args) {
          const message = String(args[0] || '');
          const allArgsStr = args.map(arg => String(arg)).join(' ').toLowerCase();
          
          // Aggressive filtering for old project WebSocket errors
          if (filterSES(...args) || 
              filterWebSocket(...args) || 
              filterCookieWarnings(...args) || 
              filterOldProjectError(...args) ||
              message.includes('ufpeftuanzmkiryohesd') ||
              allArgsStr.includes('ufpeftuanzmkiryohesd') ||
              message.includes('wss://ufpeftuanzmkiryohesd') ||
              allArgsStr.includes('wss://ufpeftuanzmkiryohesd') ||
              message.includes('realtime/v1/websocket') ||
              allArgsStr.includes('realtime/v1/websocket')) {
            return; // Silently ignore these non-critical errors
          }
          originalError.apply(console, args);
        };
        
        console.warn = function(...args) {
          if (filterSES(...args) || filterWebSocket(...args) || filterCookieWarnings(...args)) {
            return; // Silently ignore these non-critical warnings
          }
          originalWarn.apply(console, args);
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
